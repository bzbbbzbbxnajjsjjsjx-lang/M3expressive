name: Build debug APK

on:
  push:
    branches:
      - claude/android-17-phase-1-architecture-brb9ea
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform 37 and build-tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Create ephemeral release keystore
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MyExpressiveApp CI"
          {
            echo "RELEASE_KEYSTORE_PATH=$KEYSTORE"
            echo "RELEASE_KEYSTORE_PASSWORD=$PASS"
            echo "RELEASE_KEY_ALIAS=release"
            echo "RELEASE_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK (R8 minified, signed with CI keystore)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
